# Publishes the version in package.json. Run it from the Actions tab on main once the version bump
# is merged; the npm-publish environment asks a reviewer to approve.
#
# Two jobs, so that third-party code never runs next to publish rights:
#   build   - installs dependencies, runs the full check suite and packs the tarball. No write
#             permissions, no OIDC token, no environment.
#   publish - holds id-token/contents write behind the npm-publish environment, installs nothing,
#             and only publishes the tarball that build produced and creates the GitHub release.
name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      tag: ${{ steps.pack.outputs.tag }}
      prerelease: ${{ steps.pack.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Pack
        id: pack
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in
            *-*) tag=next prerelease=true ;;
            *) tag=latest prerelease=false ;;
          esac
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          mv "$RUNNER_TEMP"/release/*.tgz "$RUNNER_TEMP/release/package.tgz"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/release/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      # Only .nvmrc is needed here; nothing from the repo is installed or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/release
      - name: Check the tarball version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          packed=$(tar -xzOf "$RUNNER_TEMP/release/package.tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          if [ "$packed" != "$VERSION" ]; then
            echo "Tarball version $packed does not match package.json version $VERSION" >&2
            exit 1
          fi
      - name: Publish
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: npm publish "$RUNNER_TEMP/release/package.tgz" --ignore-scripts --provenance --access public --tag "$TAG"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "Changes: https://github.com/$GH_REPO/blob/v$VERSION/CHANGELOG.md" \
            --prerelease="$PRERELEASE"
