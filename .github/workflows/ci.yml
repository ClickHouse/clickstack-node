name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run spell
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 22 bundles an undici without the body diagnostics channels, so it skips the fetch
          # body tests and coverage is measured on Node 24 only.
          - node: "22"
            args: ""
          - node: "24"
            args: --coverage
          - node: "26"
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npm refuses to run on Node 22 (devEngines), so install on the .nvmrc version, then switch
      # Node and run Vitest directly.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: ./node_modules/.bin/vitest run --project unit ${{ matrix.args }}

  build:
    name: Build, package checks and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 22 and 26 run the fixtures in the later end-to-end passes; the .nvmrc version runs the
      # rest.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - id: node22
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - id: node26
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: publint and attw on the packed tarball
        run: npm run pack:check
      - name: Run the built package against a collector in Docker
        run: npm run test:e2e
      - name: The same with the fixtures on Node 22
        env:
          CLICKSTACK_TEST_NODE: ${{ steps.node22.outputs.path }}
        run: npm run test:e2e
      - name: The same with the fixtures on Node 26
        env:
          CLICKSTACK_TEST_NODE: ${{ steps.node26.outputs.path }}
        run: npm run test:e2e
